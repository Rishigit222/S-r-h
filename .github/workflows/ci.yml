name: Self-Healing RAG Engine CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 🧠 Ingest Knowledge Corpus
        run: |
          python -c "
          from src.ingestion.loader import load_directory
          from src.ingestion.chunker import chunk_documents
          from src.retrieval.vector_store import VectorStore
          from src.retrieval.bm25_store import BM25Store
          from src.config import settings

          docs = load_directory(settings.documents_dir)
          chunks = chunk_documents(docs, settings.chunk_size, settings.chunk_overlap)
          v_store = VectorStore()
          v_store.add_chunks(chunks)
          b_store = BM25Store()
          b_store.add_chunks(chunks)
          print(f'✓ Successfully indexed {len(docs)} documents and {len(chunks)} chunks.')
          "

      - name: 🧪 Run Automated Tests (Unit, Engine, API, Evolution)
        run: |
          pytest tests/ -v
